version: '3.8'

services:
  reverse-proxy:
    image: traefik:v2.9
    extra_hosts:
      - "host.docker.internal:172.30.0.1"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.hostname == pve
      # ⚠️ `traefik.enable=true` 를 여기 두지 않는다 (2026-08-01 제거).
      #    Traefik 이 **자기 자신**을 라우팅 대상으로 보게 되는데 포트 라벨이 없어
      #    15초마다 `service "dev-reverse-proxy" error: port is missing` 를 뱉는다.
      #    `93a26b5`(exposedByDefault=false)가 이걸 고쳤다고 기록돼 있었지만,
      #    **명시 라벨은 그 설정보다 우선하므로 안 잡혔다** — 2026-08-01 로그에서 확인.
      #    이 스팸이 json-file 회전 창(20MB×5)에서 정작 봐야 할 ACME 로그를 밀어낸다.
      #    Traefik 자신은 라우팅 대상이 아니므로 제거해도 잃는 게 없다.
      labels: []
    command:
      - "--entrypoints.metrics.address=:8080"
      - "--providers.docker=true"
      - "--providers.docker.swarmMode=true"
      # 기본값이 true 라서 Traefik 이 스웜의 모든 컨테이너를 라우팅하려 들고, 포트 라벨이 없는
      # 25개 남짓이 갱신 주기마다 `port is missing` 에러를 뱉는다. 라우팅에 영향은 없지만 로그를
      # 가득 채워, json-file 회전(20MB x 5) 안에서 정작 봐야 할 ACME 로그를 밀어낸다.
      # traefik.yml 에 exposedByDefault: false 가 적혀 있으나 그 파일은 마운트되지 않아 죽은 설정이다.
      # 라우터가 걸린 서비스(gateway, websocket-server, grafana, minio-1)에는 전부
      # traefik.enable=true 가 있으므로 끄더라도 노출이 끊기는 경로는 없다.
      - "--providers.docker.exposedByDefault=false"
      - "--entrypoints.eureka.address=:8761"
      - "--accesslog=true"
      - "--entrypoints.websecure.address=:443"
      # challenge 는 resolver 당 **하나만** 동작한다. 여기에 tlschallenge 와 dnsChallenge 가 둘 다
      # 걸려 있었고, Traefik 은 그 경우 DNS 를 택한다. 그런데 duckdns 토큰으로는 duckdns.org 존의
      # TXT 만 만들 수 있어 platformholder.site(가비아 존) 검증이 성립하지 않는다. 즉 발급 경로가
      # 설정만 봐서는 설명되지 않는 상태였다.
      # 와일드카드를 쓰지 않으므로 DNS-01 이 필요 없다. TLS-ALPN-01 단독으로 통일해 동작을
      # 결정적으로 만든다 — fmpresolver 가 이미 TLS-ALPN 단독으로 정상 발급받고 있어 이 서버에서
      # 동작한다는 것은 증명돼 있다.
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=wy9295@naver.com"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      # fmpresolver: TLS-ALPN-01 only. platformholder.site 서브도메인용 격리 resolver.
      # DNS challenge 안 쓰므로 가비아 API 없이도 발급 가능. 실패해도 myresolver에 영향 없음.
      - "--certificatesresolvers.fmpresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.fmpresolver.acme.email=wy9295@naver.com"
      - "--certificatesresolvers.fmpresolver.acme.storage=/letsencrypt/acme-fmp.json"
      # blogresolver: wp-blog 전용 격리 resolver (prd/wp-blog §4.9).
      # myresolver 를 쓰면 호스트가 하나 늘 때마다 SAN 집합이 흔들려 매번 신규 발급이
      # 도는 기존 문제(traefik-cert-churn)를 서드파티 CMS 가 직접 건드리게 된다.
      #
      # storage 분리가 격리하는 것과 **하지 못하는 것**을 구분할 것:
      #   격리된다 — acme-blog.json 이 깨져도 acme.json 의 프로덕션 인증서는 무사하다.
      #              발급 실패도 저장소를 넘어 번지지 않는다.
      #   격리 안 된다 — **Let's Encrypt 의 rate limit 은 등록 도메인 단위다.**
      #              "Certificates per Registered Domain 50/week" 는 platformholder.site
      #              하위 전부를 한 바구니로 센다. resolver 를 나눠도 같은 버킷이라,
      #              wp-blog 이 발급을 반복하면 gateway 인증서 갱신까지 함께 막힌다.
      #              → 이 resolver 를 쓰는 라우터를 늘릴 때는 그 점을 먼저 볼 것.
      - "--certificatesresolvers.blogresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.blogresolver.acme.email=wy9295@naver.com"
      - "--certificatesresolvers.blogresolver.acme.storage=/letsencrypt/acme-blog.json"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
      - "--metrics.prometheus.buckets=0.1,0.3,1.2,5.0"
      - "--metrics.prometheus.entryPoint=metrics"
    ports:
      - "8080:8080"
      # ⛔ 443 은 **host 모드여야 한다.** 단축 문법(`"443:443"`)은 ingress 모드이고,
      #    Swarm 라우팅 메시가 소스 IP 를 SNAT 해서 Traefik 이 보는 클라이언트가
      #    전부 `10.0.0.x` 가 된다.
      #    2026-08-01 실측: 액세스로그 3시간 354건이 **전부 `10.0.0.79` 단일 IP**.
      #
      #    그러면 IP 기반 방어가 한꺼번에 죽는다 —
      #      · wp-blog 관리 경로의 `ipwhitelist`(tailnet) → 아무와도 매칭 안 됨 = 영구 403
      #      · Apache `<LocationMatch>` IP 게이트 → 같은 이유로 tailnet 까지 403
      #      · `config-extra.php` 의 REMOTE_ADDR 보정 → 전 방문자가 같은 IP
      #      · rate-limit → 소스 IP 당 버킷인데 전원이 한 버킷 공유
      #    앞의 둘은 **운영자 본인을 잠근다.**
      #
      #    Traefik 은 이미 `node.hostname == pve` 고정이라 host 모드의 부작용이 없다.
      #    부수 효과: 전 서비스가 실제 클라이언트 IP 를 보게 된다(개선이지만
      #    게이트웨이 rate-limit 동작이 달라질 수 있으니 배포 후 확인할 것).
      # ⛔ **host 모드로 바꾸지 말 것 — 2026-08-01 실행했다가 전 서비스가 다운됐다.**
      #    `mode: host` 로 전환한 배포는 성공했고 포트 스펙도 반영됐지만, 그 직후
      #    443 이 외부에서 **연결 자체가 되지 않았다**(전 호스트 curl `http=000`).
      #    ingress 로 되돌려 복구. 원인 미규명 — 재시도 전에 아래를 먼저 확인할 것:
      #      · pve 호스트에서 :443 을 이미 점유한 프로세스가 있는지 (`ss -lntp | grep 443`)
      #      · 공유기 포트포워딩이 ingress VIP 를 향하는지 노드 IP 를 향하는지
      #      · 노드가 2개(`my`·`pve`)인데 포워딩 대상이 Traefik 이 도는 pve 가 맞는지
      #    → SNAT(V15) 는 여전히 미해결이다. wp-blog 의 IP 기반 방어 4종이 걸려 있으므로
      #      대안(예: Traefik `proxyProtocol`, 또는 노드 1개로 축소)을 먼저 설계할 것.
      - "443:443"
    networks:
      - internal-network
      - gateway
      # wp-blog 전용 엣지. WordPress 는 서드파티 CMS 라 `internal-network` 에 두지
      # 않는다 — RCE 1건이 브라우저를 전혀 경유하지 않고 auth-server·gateway·
      # find-my-pet-backend 의 내부 포트와 무인증 Kafka(9092)·eureka(8761)·MinIO 에
      # L3 로 직접 도달한다(prd/wp-blog §4.8 경로 ③).
      # Traefik 만 양쪽에 걸쳐 라우팅한다.
      #   사전 생성 필요: docker network create -d overlay --attachable wpblog-edge
      - wpblog-edge
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - letsencrypt:/letsencrypt
    # loki 드라이버로 두면 Traefik 로그가 어디에도 남지 않는다. Loki 에는 `job` 라벨 자체가 없고
    # (실제 유입은 Spring 앱들이 직접 push 하는 `app=` 스트림뿐), Docker 는 json-file/journald 가
    # 아니면 `docker service logs` 읽기를 지원하지 않는다. 즉 쓰기도 안 되고 읽기도 안 되는 상태였다.
    # ACME 실패 원인을 사후에 볼 수 있어야 해서 json-file 로 되돌린다. 회전 옵션이 없으면 액세스로그가
    # 디스크를 채우므로 함께 건다.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
#  nginx:
