  # ───────────────────────────────────────────────────────────────────────────
  # apex-static — 루트 도메인의 정적 파일 서빙 (현재는 ads.txt 하나)
  #
  #   왜 별도 서비스인가:
  #   ads.txt 는 AdSense 계정 1개로 전 사이트(wp-blog·trainer·…)를 돌리는 구조라
  #   **어느 한 제품이 아니라 공용 인프라 자산**이다. 제품 컨테이너(wp-blog 등)에
  #   얹으면 그 제품이 죽을 때 전 사이트의 판매자 인증이 함께 죽는다.
  #   그래서 인프라 레포가 소유하고, 아무 앱에도 의존하지 않는 최소 컨테이너로 둔다.
  #
  #   Traefik 라우터가 apex 를 받으므로 **이 서비스가 apex 인증서 발급을 촉발한다**
  #   — traefik-cert-churn 문서의 "발급 카나리아" 역할을 겸한다.
  #   기존 8호스트 번들의 SAN 집합을 건드리지 않고 단일 도메인 인증서 1장만 새로 받는다.
  #
  #   ⚠️ Swarm config 는 불변이다. ads.txt 내용을 고치면 `apex_ads_txt_v1` 을 v2 로
  #      올리고 아래 source 도 함께 바꿔야 한다. 이름만 두면 옛 내용이 계속 서빙된다.
  # ───────────────────────────────────────────────────────────────────────────
  apex-static:
    image: nginx:1.29-alpine
    networks:
      - internal-network
    configs:
      - source: apex_ads_txt_v1
        target: /usr/share/nginx/html/ads.txt
        mode: 0444
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == pve
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.1'
          memory: 32M
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=internal-network"
        - "traefik.http.services.apexstatic.loadbalancer.server.port=80"
        # apex 의 /ads.txt 만 가져간다. 나머지 apex 경로는 다른 라우터(리다이렉트)가 받는다.
        # priority 를 명시하는 이유: 리다이렉트 라우터보다 **반드시 먼저** 매칭돼야
        # ads.txt 가 301 로 새어나가지 않는다. (스펙상 같은 루트 도메인 내 리다이렉트는
        # 허용되지만, 크롤러가 한 번 덜 도는 편이 낫고 의존도 줄어든다)
        - "traefik.http.routers.apexstatic.rule=(Host(`platformholder.site`) || Host(`www.platformholder.site`)) && Path(`/ads.txt`)"
        - "traefik.http.routers.apexstatic.entrypoints=websecure"
        - "traefik.http.routers.apexstatic.tls=true"
        - "traefik.http.routers.apexstatic.tls.certresolver=myresolver"
        - "traefik.http.routers.apexstatic.priority=200"

        # ── apex 의 나머지 경로 → blog 로 301 ────────────────────────────────
        # apex 가 /ads.txt 말고 전부 404 인 상태는 AdSense 심사에서 "콘텐츠 없는
        # 사이트" 로 읽힌다(반려 사유 1위가 not enough original content).
        # AdSense 의 "사이트" 는 platformholder.site **전 서브도메인**이고
        # blog·trainer 에는 실제 콘텐츠가 있는데, apex 가 막다른 길이라 크롤러가
        # 거기로 들어갈 경로가 없다. 301 로 길을 낸다.
        #
        # priority 를 낮게 둬서 위 /ads.txt 라우터가 **먼저** 매칭되게 한다 —
        # ads.txt 는 리다이렉트 없이 직접 서빙되어야 판정이 가장 확실하다.
        # service 는 형식상 필요할 뿐이다(미들웨어가 서비스 도달 전에 응답한다).
        - "traefik.http.routers.apexredirect.rule=Host(`platformholder.site`) || Host(`www.platformholder.site`)"
        - "traefik.http.routers.apexredirect.entrypoints=websecure"
        - "traefik.http.routers.apexredirect.tls=true"
        - "traefik.http.routers.apexredirect.tls.certresolver=myresolver"
        - "traefik.http.routers.apexredirect.service=apexstatic"
        - "traefik.http.routers.apexredirect.middlewares=apex-to-blog"
        - "traefik.http.routers.apexredirect.priority=1"
        - "traefik.http.middlewares.apex-to-blog.redirectregex.regex=^https://(?:www\\.)?platformholder\\.site/(.*)"
        - "traefik.http.middlewares.apex-to-blog.redirectregex.replacement=https://blog.platformholder.site/$${1}"
        - "traefik.http.middlewares.apex-to-blog.redirectregex.permanent=true"

  kafka1:
    image: 'bitnamilegacy/kafka:3.9'
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.hostname == pve
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka1:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - CLUSTER_ID="YyV8UqkzTOG4JfG0xVHoWw"
    ports:
      - "9092:9092"
      - "9093:9093"
    volumes:
      - kafka1:/bitnami/kafka/data
    networks:
      - internal-network

networks:
  internal-network:
    driver: overlay
    attachable: true
    name: internal-network
  gateway:
    driver: overlay
    attachable: true
    name: gateway
  # wp-blog 스택과 공유한다. 그 스택이 만들면 이름이 `wp-blog_wpblog-edge` 가 되어
  # 여기서 붙을 수 없으므로, 스택 밖에서 수동 생성하고 양쪽 다 external 로 참조한다.
  wpblog-edge:
    external: true

volumes:
  kafka1:
  letsencrypt:
    driver: local
  wordpress_data:

configs:
  # ⚠️ `nginx_config` 선언을 제거했다 (2026-08-01).
  #    쓰는 서비스가 없다 — 유일한 참조가 주석 처리된 nginx 블록이었다.
  #    그런데 남겨두면 `docker stack deploy` 가 매번 `dev_nginx_config` 갱신을 시도하고,
  #    Swarm config 는 불변이라 `only updates to Labels are allowed` 로 **배포 전체가 죽는다.**
  #    (7/26 까지는 config 를 쓰는 서비스가 하나도 없어 CLI 가 이 섹션을 건너뛰었고,
  #     apex-static 이 처음으로 config 를 참조하면서 드러났다.)
  #    nginx 를 되살릴 때는 `nginx_config_v2` 처럼 새 이름으로 넣을 것 —
  #    prometheus_config 가 _v2·_v3·_v4 로 올라간 것과 같은 이유다.
  #    서버의 기존 `dev_nginx_config` 객체는 그대로 남는다(stack deploy 는 config 를 지우지 않는다).
  #
  # 내용을 바꾸면 이름을 _v2 로 올릴 것 — Swarm config 는 불변이다 (apex-static 주석 참조)
  apex_ads_txt_v1:
    file: apex-static/ads.txt