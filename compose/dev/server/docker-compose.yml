version: '3.8'

secrets:
  s3_access_key:
    external: true
  s3_secret_key:
    external: true
  ors_api_key:
    external: true
  public_data_api_key:
    external: true

services:
  auth-server:
    image: 'wy9295/auth-server:b46cf211c120a30c0304ed5532ce61351b5af536'
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
        monitor: 90s
        failure_action: rollback
      rollback_config:
        order: start-first
        parallelism: 1
      placement:
        constraints:
          - "node.hostname == pve"
      labels:
        - "prometheus.enable=true"
        - "prometheus.scrape=true"
        - "prometheus.path=/actuator/prometheus"
        - "prometheus.port=8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - internal-network
      - auth-server
      - barbellrobot-backend
    environment:
      - REDIS_PORT=6379
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - RDBMS_URL=mysql-master
      - RDBMS_USERNAME=${RDBMS_USERNAME}
      - RDBMS_PASSWORD=${RDBMS_PASSWORD}
      - ACCESS_SECRET_KEY=${ACCESS_SECRET_KEY}
      - ACCESS_EXPIRE_MILLIS=${ACCESS_EXPIRE_MILLIS}
      - REFRESH_SECRET_KEY=${REFRESH_SECRET_KEY}
      - REFRESH_EXPIRE_MILLIS=${REFRESH_EXPIRE_MILLIS}
      - EUREKA_URI=http://eureka:8761/eureka
      - PYROSCOPE_SERVER_ADDRESS=http://pyroscope:4040
      - PYROSCOPE_APPLICATION_NAME=dev-auth

  find-my-pet-backend:
    image: 'wy9295/find-my-pet-backend:bd1cd6f70eb2c53a8a5e93e023a4257e2613d927'
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
        monitor: 90s
        failure_action: rollback
      rollback_config:
        order: start-first
        parallelism: 1
      placement:
        constraints:
          - "node.hostname == pve"
      labels:
        - "prometheus.enable=true"
        - "prometheus.scrape=true"
        - "prometheus.path=/actuator/prometheus"
        - "prometheus.port=8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - internal-network
      - find-my-pet-backend
#    - AUTH_HOST=auth 는 전환 때문에 잠시 추가함 최신버전 배포 후 수정
    secrets:
      - source: ors_api_key
        target: ors_api_key
      - source: public_data_api_key
        target: public_data_api_key
    environment:
      - REDIS_PORT=6379
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - RDBMS_URI=mysql-master
      - RDBMS_USERNAME=${RDBMS_USERNAME}
      - RDBMS_PASSWORD=${RDBMS_PASSWORD}
      - AUTH_NAME=auth
      - AUTH_HOST=auth
      - STORAGE_NAME=storage
      - PLATFORM_HOLDER_CDN_HOST=https://cdn.platformholder.site
      - KAFKA_HOST=kafka1:9092
      - EUREKA_URI=http://eureka:8761/eureka
      - MONGODB_USERNAME=${MONGODB_USERNAME}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD}
      - MONGODB_HOST=mongodb
      - ORS_API_KEY_FILE=/run/secrets/ors_api_key
      - PUBLIC_DATA_API_KEY_FILE=/run/secrets/public_data_api_key

  barbellrobot-backend:
    image: 'wy9295/barbellrobot-backend:4b81f6a4d681f7eabb762d8efb5d72cef010b944'
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
        monitor: 90s
        failure_action: rollback
      rollback_config:
        order: start-first
        parallelism: 1
      placement:
        constraints:
          - "node.hostname == pve"
      labels:
        - "prometheus.enable=true"
        - "prometheus.scrape=true"
        - "prometheus.path=/actuator/prometheus"
        - "prometheus.port=8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - internal-network
      - barbellrobot-backend
    environment:
      - REDIS_PORT=6379
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - RDBMS_URI=mysql-master
      - RDBMS_USERNAME=${RDBMS_USERNAME}
      - RDBMS_PASSWORD=${RDBMS_PASSWORD}
      - EUREKA_URI=http://eureka:8761/eureka
      - AUTH_NAME=auth
      - STORAGE_NAME=storage
      - AI_SERVICE_NAME=spring-ai
      - PLATFORM_HOLDER_CDN_HOST=https://cdn.platformholder.site
      - APPLICATION_ID=019d1af5-288f-70d5-a39e-783fd6dc30af
      - ACCESS_SECRET_KEY=${ACCESS_SECRET_KEY}
      - ACCESS_EXPIRE_MILLIS=${ACCESS_EXPIRE_MILLIS}
      - REFRESH_SECRET_KEY=${REFRESH_SECRET_KEY}
      - REFRESH_EXPIRE_MILLIS=${REFRESH_EXPIRE_MILLIS}
      - GMAIL_USERNAME=${GMAIL_USERNAME}
      - GMAIL_PASSWORD=${GMAIL_PASSWORD}

  gateway:
    image: 'wy9295/gateway:885d4b5697340d637490f2417fd16f9b847fab47'
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
        monitor: 90s
        failure_action: rollback
      rollback_config:
        order: start-first
        parallelism: 1
      placement:
        constraints:
          - "node.hostname == pve"
      labels:
        - "prometheus.enable=true"
        - "prometheus.scrape=true"
        - "prometheus.path=/actuator/prometheus"
        - "prometheus.port=8080"
        - "traefik.enable=true"
        # 라우터를 호스트별로 쪼갠 이유 — 인증서 churn 차단.
        #
        # 종전에는 라우터 하나가 `Host(a) || Host(b) || ...` 로 8개를 받았다. Traefik 은 "라우터가
        # 쓰는 도메인 전부 = 인증서 1장" 으로 묶으므로 SAN 8개짜리 인증서가 만들어진다. 그런데 Let's
        # Encrypt 에게 인증서의 정체성은 **이름의 집합**이다. {a,b,c,d} 와 {a,b,c} 는 같은 인증서가
        # 바뀐 게 아니라 서로 다른 두 장이다.
        #
        # 그래서 이름이 하나만 달라져도 갱신이 아니라 신규 발급이 나갔다. 집합은 규칙을 고칠 때
        # (fmp 가 빠지고 find-my-pet.duckdns.org 가 들어왔다) 뿐 아니라 롤링 배포 중 Traefik 눈에
        # 일부 서비스만 보이는 순간에도 달라진다. 2026-07-23~25 사흘 동안 SAN 6→1→5→4→7 로
        # 다섯 장이 발급됐고, 지금도 6/19·7/23·7/25 판 세 장이 동시에 서빙되고 있었다.
        # 그 결과 LE 의 "동일 인증서 주당 5장" 한도에 걸리면 8개 호스트가 한꺼번에 자체서명으로
        # 떨어진다 — https 갱신이 가끔 안 되던 원인이다.
        #
        # 호스트당 라우터 1개면 인증서에 이름이 하나뿐이라 집합이 바뀔 수가 없다. 배포 중 서비스가
        # 잠깐 사라져도 그 호스트 하나만 영향받고, 다음부터는 이름이 같으므로 진짜 갱신이 된다.
        # 모든 라우터가 `service=gateway` 로 같은 백엔드를 가리키므로 트래픽 경로는 종전과 동일하다.
        - "traefik.http.services.gateway.loadbalancer.server.port=8080"
        - "traefik.http.routers.gw-wooauth.rule=Host(`woo-auth.duckdns.org`)"
        - "traefik.http.routers.gw-wooauth.entrypoints=websecure"
        - "traefik.http.routers.gw-wooauth.tls.certresolver=myresolver"
        - "traefik.http.routers.gw-wooauth.service=gateway"
        - "traefik.http.routers.gw-bbr.rule=Host(`bbr.platformholder.site`)"
        - "traefik.http.routers.gw-bbr.entrypoints=websecure"
        - "traefik.http.routers.gw-bbr.tls.certresolver=myresolver"
        - "traefik.http.routers.gw-bbr.service=gateway"
        - "traefik.http.routers.gw-cdn.rule=Host(`cdn.platformholder.site`)"
        - "traefik.http.routers.gw-cdn.entrypoints=websecure"
        - "traefik.http.routers.gw-cdn.tls.certresolver=myresolver"
        - "traefik.http.routers.gw-cdn.service=gateway"
        - "traefik.http.routers.gw-forest.rule=Host(`forest.platformholder.site`)"
        - "traefik.http.routers.gw-forest.entrypoints=websecure"
        - "traefik.http.routers.gw-forest.tls.certresolver=myresolver"
        - "traefik.http.routers.gw-forest.service=gateway"
        - "traefik.http.routers.gw-auth.rule=Host(`auth.platformholder.site`)"
        - "traefik.http.routers.gw-auth.entrypoints=websecure"
        - "traefik.http.routers.gw-auth.tls.certresolver=myresolver"
        - "traefik.http.routers.gw-auth.service=gateway"
        - "traefik.http.routers.gw-mirrorview.rule=Host(`mirror-view.platformholder.site`)"
        - "traefik.http.routers.gw-mirrorview.entrypoints=websecure"
        - "traefik.http.routers.gw-mirrorview.tls.certresolver=myresolver"
        - "traefik.http.routers.gw-mirrorview.service=gateway"
        - "traefik.http.routers.gw-gateway.rule=Host(`gateway.platformholder.site`)"
        - "traefik.http.routers.gw-gateway.entrypoints=websecure"
        - "traefik.http.routers.gw-gateway.tls.certresolver=myresolver"
        - "traefik.http.routers.gw-gateway.service=gateway"
        - "traefik.http.routers.gw-backoffice.rule=Host(`backoffice.platformholder.site`)"
        - "traefik.http.routers.gw-backoffice.entrypoints=websecure"
        - "traefik.http.routers.gw-backoffice.tls.certresolver=myresolver"
        - "traefik.http.routers.gw-backoffice.service=gateway"
        # 격리된 fmp 라우터: TLS-ALPN-01로 자체 cert 발급. 실패해도 위 번들과 독립.
        - "traefik.http.routers.fmp-gateway.rule=Host(`fmp.platformholder.site`)"
        - "traefik.http.routers.fmp-gateway.service=gateway"
        - "traefik.http.routers.fmp-gateway.entrypoints=websecure"
        - "traefik.http.routers.fmp-gateway.tls=true"
        - "traefik.http.routers.fmp-gateway.tls.certresolver=fmpresolver"
        - "traefik.docker.network=gateway"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - internal-network
      - gateway
    environment:
      - BBR_NAME=dev-bbr-backend
      - FMP_NAME=dev-fmp-backend
      - AUTH_NAME=dev-auth
      - BBR_HOST=barbellrobot-backend
      - FMP_HOST=find-my-pet-backend
      - AUTH_HOST=auth-server
      - STORAGE_HOST=storage
      - STORAGE_NAME=dev-storage
      - EUREKA_URI=http://eureka:8761/eureka
      - FOREST_NAME=dev-forest
      - FOREST_HOST=forest
      - MV_NAME=dev-mirror-view
      - MV_HOST=mirror-view
      - BACKOFFICE_NAME=dev-backoffice-bff
      - BACKOFFICE_HOST=backoffice-bff

  eureka:
    image: 'wy9295/eureka:273ceb3db81d3726dd9db44eb1854e19c9a2af3b'
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - "node.hostname == my"
    networks:
      - internal-network

  orchestrator:
    image: 'wy9295/orchestrator:798d4981dd564532020f2371925c0f7ceadec5e9'
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
        monitor: 90s
        failure_action: rollback
      rollback_config:
        order: start-first
        parallelism: 1
      placement:
        constraints:
          - "node.hostname == pve"
      labels:
        - "prometheus.enable=true"
        - "prometheus.scrape=true"
        - "prometheus.path=/actuator/prometheus"
        - "prometheus.port=8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - internal-network
      - barbellrobot-backend
    environment:
      - RDBMS_USERNAME=${RDBMS_USERNAME}
      - RDBMS_PASSWORD=${RDBMS_PASSWORD}
      - RDBMS_URL=mysql-master
      - AUTH_RDBMS_URL=mysql-master
      - AUTH_RDBMS_USER=${RDBMS_USERNAME}
      - AUTH_RDBMS_PASSWORD=${RDBMS_PASSWORD}
      - KAFKA_HOST=kafka1:9092
      - PYROSCOPE_SERVER_ADDRESS=http://pyroscope:4040
      - PYROSCOPE_APPLICATION_NAME=dev-orchestrator
      - REDIS_PORT=6379
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}

  storage:
    image: 'wy9295/storage:b3554d410e17168607b167dab67c42afabc6b6f9'
    extra_hosts:
      - "bucket.platformholder.site:172.30.1.42"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
