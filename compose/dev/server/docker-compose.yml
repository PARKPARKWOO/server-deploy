version: '3.8'

secrets:
  s3_access_key:
    external: true
  s3_secret_key:
    external: true
  ors_api_key:
    external: true
  public_data_api_key:
    external: true

services:
  auth-server:
    image: 'wy9295/auth-server:b46cf211c120a30c0304ed5532ce61351b5af536'
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
        monitor: 90s
        failure_action: rollback
      rollback_config:
        order: start-first
        parallelism: 1
      placement:
        constraints:
          - "node.hostname == pve"
      labels:
        - "prometheus.enable=true"
        - "prometheus.scrape=true"
        - "prometheus.path=/actuator/prometheus"
        - "prometheus.port=8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - internal-network
      - auth-server
      - barbellrobot-backend
    environment:
      - REDIS_PORT=6379
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - RDBMS_URL=mysql-master
      - RDBMS_USERNAME=${RDBMS_USERNAME}
      - RDBMS_PASSWORD=${RDBMS_PASSWORD}
      - ACCESS_SECRET_KEY=${ACCESS_SECRET_KEY}
      - ACCESS_EXPIRE_MILLIS=${ACCESS_EXPIRE_MILLIS}
      - REFRESH_SECRET_KEY=${REFRESH_SECRET_KEY}
      - REFRESH_EXPIRE_MILLIS=${REFRESH_EXPIRE_MILLIS}
      - EUREKA_URI=http://eureka:8761/eureka
      - PYROSCOPE_SERVER_ADDRESS=http://pyroscope:4040
      - PYROSCOPE_APPLICATION_NAME=dev-auth

  find-my-pet-backend:
    image: 'wy9295/find-my-pet-backend:bd1cd6f70eb2c53a8a5e93e023a4257e2613d927'
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
        monitor: 90s
        failure_action: rollback
      rollback_config:
        order: start-first
        parallelism: 1
      placement:
        constraints:
          - "node.hostname == pve"
      labels:
        - "prometheus.enable=true"
        - "prometheus.scrape=true"
        - "prometheus.path=/actuator/prometheus"
        - "prometheus.port=8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - internal-network
      - find-my-pet-backend
#    - AUTH_HOST=auth 는 전환 때문에 잠시 추가함 최신버전 배포 후 수정
    secrets:
      - source: ors_api_key
        target: ors_api_key
      - source: public_data_api_key
        target: public_data_api_key
    environment:
      - REDIS_PORT=6379
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - RDBMS_URI=mysql-master
      - RDBMS_USERNAME=${RDBMS_USERNAME}
      - RDBMS_PASSWORD=${RDBMS_PASSWORD}
      - AUTH_NAME=auth
      - AUTH_HOST=auth
      - STORAGE_NAME=storage
      - PLATFORM_HOLDER_CDN_HOST=https://cdn.platformholder.site
      - KAFKA_HOST=kafka1:9092
      - EUREKA_URI=http://eureka:8761/eureka
      - MONGODB_USERNAME=${MONGODB_USERNAME}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD}
      - MONGODB_HOST=mongodb
      - ORS_API_KEY_FILE=/run/secrets/ors_api_key
      - PUBLIC_DATA_API_KEY_FILE=/run/secrets/public_data_api_key

  barbellrobot-backend:
    image: 'wy9295/barbellrobot-backend:4b81f6a4d681f7eabb762d8efb5d72cef010b944'
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
        monitor: 90s
        failure_action: rollback
      rollback_config:
        order: start-first
        parallelism: 1
      placement:
        constraints:
          - "node.hostname == pve"
      labels:
        - "prometheus.enable=true"
        - "prometheus.scrape=true"
        - "prometheus.path=/actuator/prometheus"
        - "prometheus.port=8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - internal-network
      - barbellrobot-backend
    environment:
      - REDIS_PORT=6379
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - RDBMS_URI=mysql-master
      - RDBMS_USERNAME=${RDBMS_USERNAME}
      - RDBMS_PASSWORD=${RDBMS_PASSWORD}
      - EUREKA_URI=http://eureka:8761/eureka
      - AUTH_NAME=auth
      - STORAGE_NAME=storage
      - AI_SERVICE_NAME=spring-ai
      - PLATFORM_HOLDER_CDN_HOST=https://cdn.platformholder.site
      - APPLICATION_ID=019d1af5-288f-70d5-a39e-783fd6dc30af
      - ACCESS_SECRET_KEY=${ACCESS_SECRET_KEY}
      - ACCESS_EXPIRE_MILLIS=${ACCESS_EXPIRE_MILLIS}
      - REFRESH_SECRET_KEY=${REFRESH_SECRET_KEY}
      - REFRESH_EXPIRE_MILLIS=${REFRESH_EXPIRE_MILLIS}
      - GMAIL_USERNAME=${GMAIL_USERNAME}
      - GMAIL_PASSWORD=${GMAIL_PASSWORD}

  gateway:
    image: 'wy9295/gateway:885d4b5697340d637490f2417fd16f9b847fab47'
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
        monitor: 90s
        failure_action: rollback
      rollback_config:
        order: start-first
        parallelism: 1
      placement:
        constraints:
          - "node.hostname == pve"
      labels:
        - "prometheus.enable=true"
        - "prometheus.scrape=true"
        - "prometheus.path=/actuator/prometheus"
        - "prometheus.port=8080"
        - "traefik.enable=true"
        # 메인 라우터: duckdns DNS challenge로 발급된 기존 cert 사용.
        # fmp.platformholder.site 는 이 번들에서 제외 — cert 갱신 영향 격리.
        - "traefik.http.routers.gateway.rule=Host(`woo-auth.duckdns.org`) || Host(`bbr.platformholder.site`) || Host(`cdn.platformholder.site`) || Host(`forest.platformholder.site`) || Host(`auth.platformholder.site`) || Host(`mirror-view.platformholder.site`) || Host(`gateway.platformholder.site`) || Host(`backoffice.platformholder.site`)"
        - "traefik.http.services.gateway.loadbalancer.server.port=8080"
        - "traefik.http.routers.gateway.entrypoints=websecure"
        - "traefik.http.routers.gateway.tls=true"
        - "traefik.http.routers.gateway.tls.certresolver=myresolver"
        # 격리된 fmp 라우터: TLS-ALPN-01로 자체 cert 발급. 실패해도 위 번들과 독립.
        - "traefik.http.routers.fmp-gateway.rule=Host(`fmp.platformholder.site`)"
        - "traefik.http.routers.fmp-gateway.service=gateway"
        - "traefik.http.routers.fmp-gateway.entrypoints=websecure"
        - "traefik.http.routers.fmp-gateway.tls=true"
        - "traefik.http.routers.fmp-gateway.tls.certresolver=fmpresolver"
        # ── 카나리아 겸 apex 라우터 ──────────────────────────────────────────
        # 목적 두 가지.
        # 1) duckdns DNS challenge 를 걷어낸 뒤 TLS-ALPN-01 로 **실제 발급이 되는지** 확인한다.
        #    기존 8개 호스트 번들의 SAN 집합을 전혀 건드리지 않으면서(= churn 을 새로 만들지 않으면서)
        #    완전히 새로운 단일 도메인 인증서 1장을 요청하므로, 실패해도 살아있는 인증서에 영향이 없다.
        #    여기서 발급이 확인돼야 호스트별 분리(8장 동시 요청)를 안전하게 진행할 수 있다.
        # 2) AdSense 에 등록한 사이트가 platformholder.site 인데 apex 가 응답하지 않는다.
        #    443 은 열려 있고 이 호스트를 받는 라우터만 없던 상태다.
        #
        # blog 로 301 을 보내는 이유: apex 가 블로그(자체 저작 콘텐츠)를 보여주게 되고,
        # ads.txt 는 규격상 루트 도메인에서 찾으므로 platformholder.site/ads.txt →
        # blog.platformholder.site/ads.txt 체인이 성립한다(같은 루트 도메인 내 리다이렉트는 허용).
        # blog 는 Vercel 에 있으므로 SEO 정본은 그대로 blog 에 남는다.
        - "traefik.http.routers.apex.rule=Host(`platformholder.site`) || Host(`www.platformholder.site`)"
        - "traefik.http.routers.apex.entrypoints=websecure"
        - "traefik.http.routers.apex.tls.certresolver=myresolver"
        - "traefik.http.routers.apex.service=gateway"
        - "traefik.http.routers.apex.middlewares=apex-to-blog"
        - "traefik.http.middlewares.apex-to-blog.redirectregex.regex=^https://(?:www\\.)?platformholder\\.site/(.*)"
        - "traefik.http.middlewares.apex-to-blog.redirectregex.replacement=https://blog.platformholder.site/$${1}"
        - "traefik.http.middlewares.apex-to-blog.redirectregex.permanent=true"
        - "traefik.docker.network=gateway"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - internal-network
      - gateway
    environment:
      - BBR_NAME=dev-bbr-backend
      - FMP_NAME=dev-fmp-backend
      - AUTH_NAME=dev-auth
      - BBR_HOST=barbellrobot-backend
      - FMP_HOST=find-my-pet-backend
      - AUTH_HOST=auth-server
      - STORAGE_HOST=storage
      - STORAGE_NAME=dev-storage
      - EUREKA_URI=http://eureka:8761/eureka
      - FOREST_NAME=dev-forest
      - FOREST_HOST=forest
      - MV_NAME=dev-mirror-view
      - MV_HOST=mirror-view
      - BACKOFFICE_NAME=dev-backoffice-bff
      - BACKOFFICE_HOST=backoffice-bff

  eureka:
    image: 'wy9295/eureka:273ceb3db81d3726dd9db44eb1854e19c9a2af3b'
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - "node.hostname == my"
    networks:
      - internal-network

  orchestrator:
    image: 'wy9295/orchestrator:798d4981dd564532020f2371925c0f7ceadec5e9'
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
        monitor: 90s
        failure_action: rollback
      rollback_config:
        order: start-first
        parallelism: 1
      placement:
        constraints:
          - "node.hostname == pve"
      labels:
        - "prometheus.enable=true"
        - "prometheus.scrape=true"
        - "prometheus.path=/actuator/prometheus"
        - "prometheus.port=8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - internal-network
      - barbellrobot-backend
    environment:
      - RDBMS_USERNAME=${RDBMS_USERNAME}
      - RDBMS_PASSWORD=${RDBMS_PASSWORD}
      - RDBMS_URL=mysql-master
      - AUTH_RDBMS_URL=mysql-master
      - AUTH_RDBMS_USER=${RDBMS_USERNAME}
      - AUTH_RDBMS_PASSWORD=${RDBMS_PASSWORD}
      - KAFKA_HOST=kafka1:9092
      - PYROSCOPE_SERVER_ADDRESS=http://pyroscope:4040
      - PYROSCOPE_APPLICATION_NAME=dev-orchestrator
      - REDIS_PORT=6379
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}

  storage:
    image: 'wy9295/storage:b3554d410e17168607b167dab67c42afabc6b6f9'
    extra_hosts:
      - "bucket.platformholder.site:172.30.1.42"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
        monitor: 90s
        failure_action: rollback
      rollback_config:
        order: start-first
        parallelism: 1
      labels:
        - "prometheus.enable=true"
        - "prometheus.scrape=true"
        - "prometheus.path=/actuator/prometheus"
        - "prometheus.port=8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    secrets:
      - source: s3_access_key
        target: minio.access-key
      - source: s3_secret_key
        target: minio.secret-key
    networks:
      - internal-network
    environment:
      - REDIS_PORT=6379
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - RDBMS_URL=mysql-master
      - RDBMS_USERNAME=${RDBMS_USERNAME}
      - RDBMS_PASSWORD=${RDBMS_PASSWORD}
      - EUREKA_URI=http://eureka:8761/eureka
      - PYROSCOPE_SERVER_ADDRESS=http://pyroscope:4040
      - PYROSCOPE_APPLICATION_NAME=dev-storage
      - AUTH_NAME=auth
      - AUTH_HOST=auth
      - CASSANDRA_URL=cassandra-1
      - CASSANDRA_USERNAME=${CASSANDRA_USERNAME}
      - CASSANDRA_PASSWORD=${CASSANDRA_PASSWORD}
      - KAFKA_HOST=kafka1:9092
      - SPRING_CONFIG_IMPORT=optional:configtree:/run/secrets/
      - MINIO_URL=https://bucket.platformholder.site
      - MINIO_INTERNAL_URL=http://minio-1:9000
  forest:
    image: 'wy9295/forest:42a8f757db498a21ad017ad40e06e4a75b4dba0f'
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
        monitor: 90s
        failure_action: rollback
      rollback_config:
        order: start-first
        parallelism: 1
      labels:
        - "prometheus.enable=true"
        - "prometheus.scrape=true"
        - "prometheus.path=/actuator/prometheus"
        - "prometheus.port=8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - internal-network
    environment:
      - REDIS_PORT=6379
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - RDBMS_URL=mysql-master
      - RDBMS_USERNAME=${RDBMS_USERNAME}
      - RDBMS_PASSWORD=${RDBMS_PASSWORD}
      - EUREKA_URI=http://eureka:8761/eureka
      - PYROSCOPE_SERVER_ADDRESS=http://pyroscope:4040
      - PYROSCOPE_APPLICATION_NAME=dev-forest
#      - CASSANDRA_URL=cassandra-1
#      - CASSANDRA_USERNAME=${CASSANDRA_USERNAME}
#      - CASSANDRA_PASSWORD=${CASSANDRA_PASSWORD}
      - MONGODB_USERNAME=${MONGODB_USERNAME}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD}
      - MONGODB_HOST=mongodb
      - AUTH_NAME=auth
      - AUTH_HOST=auth
      - STORAGE_NAME=storage
      - PLATFORM_HOLDER_CDN_HOST=https://cdn.platformholder.site
      - KAFKA_HOST=kafka1:9092
      - AES_KEY=${AES_KEY}
      - HMAC_KEY=${HMAC_KEY}

  websocket-server:
    image: 'wy9295/websocket-server:841abc9'
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
        monitor: 60s
        failure_action: rollback
      rollback_config:
        order: start-first
        parallelism: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.ws-secure.rule=Host(`ws.platformholder.site`)"
        - "traefik.http.routers.ws-secure.entrypoints=websecure"
        - "traefik.http.routers.ws-secure.tls.certresolver=myresolver"
        - "traefik.http.services.ws-service.loadbalancer.server.port=8080"
        - "traefik.http.routers.ws-secure.service=ws-service"
        - "prometheus.enable=true"
        - "prometheus.scrape=true"
        - "prometheus.path=/metrics"
        - "prometheus.port=8080"
    networks:
      - internal-network
    environment:
      - REDIS_PORT=6379
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - EUREKA_URI=http://eureka:8761/eureka
      - AUTH_NAME=auth-server
      - AUTH_HOST=auth-server:9090
      - KAFKA_HOST=kafka1:9092
      - STORAGE_NAME=storage
      - PLATFORM_HOLDER_CDN_HOST=https://cdn.platformholder.site
      - MV_HOST=http://mirror-view-backend:8080

  mirror-view-backend:
    image: 'wy9295/mirror-view-backend:e7b05b90634c8443a63eec821162cde4598fd76b'
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
        monitor: 90s
        failure_action: rollback
      rollback_config:
        order: start-first
        parallelism: 1
      labels:
        - "prometheus.enable=true"
        - "prometheus.scrape=true"
        - "prometheus.path=/actuator/prometheus"
        - "prometheus.port=8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - internal-network
#    secrets:
#      - source: s3_access_key
#        target: minio.access-key
#      - source: s3_secret_key
#        target: minio.secret-key
    environment:
      - REDIS_PORT=6379
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - EUREKA_URI=http://eureka:8761/eureka
      - AUTH_NAME=auth
      - AUTH_HOST=auth
      - KAFKA_HOST=kafka1:9092
      - CASSANDRA_URL=cassandra-1
      - CASSANDRA_USERNAME=${CASSANDRA_USERNAME}
      - CASSANDRA_PASSWORD=${CASSANDRA_PASSWORD}
      - RDBMS_URL=mysql-master
      - RDBMS_USERNAME=${RDBMS_USERNAME}
      - RDBMS_PASSWORD=${RDBMS_PASSWORD}
      - PYROSCOPE_SERVER_ADDRESS=http://pyroscope:4040
      - PYROSCOPE_APPLICATION_NAME=dev-mirror-view
      - PLATFORM_HOLDER_CDN_HOST=https://cdn.platformholder.site
      - STORAGE_NAME=storage

  spring-ai:
    image: 'wy9295/spring-ai:649a6bcfc762af9f99ae77dcabf57ae2ad6e26d4'
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
        monitor: 90s
        failure_action: rollback
      rollback_config:
        order: start-first
        parallelism: 1
      placement:
        constraints:
          - "node.hostname == pve"
      labels:
        - "prometheus.enable=true"
        - "prometheus.scrape=true"
        - "prometheus.path=/actuator/prometheus"
        - "prometheus.port=8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - internal-network
    environment:
      - MYSQL_HOST=mysql-master
      - MYSQL_PORT=3306
      - MYSQL_USERNAME=${RDBMS_USERNAME}
      - MYSQL_PASSWORD=${RDBMS_PASSWORD}
      - FLYWAY_USER=${RDBMS_USERNAME}
      - FLYWAY_PASSWORD=${RDBMS_PASSWORD}
      - REDIS_PORT=6379
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - EUREKA_URI=http://eureka:8761/eureka
      - GRPC_PORT=9090
      - PYROSCOPE_SERVER_ADDRESS=http://pyroscope:4040
      - PYROSCOPE_APPLICATION_NAME=dev-spring-ai
      - API_KEY_SECRET_BASE64=${API_KEY_SECRET_BASE64}

  backoffice-bff:
    image: 'wy9295/backoffice-bff:4c433b0195e4e89aafbe0da9254a1992b67f8659'
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
        monitor: 90s
        failure_action: rollback
      rollback_config:
        order: start-first
        parallelism: 1
      placement:
        constraints:
          - "node.hostname == pve"
      labels:
        - "prometheus.enable=true"
        - "prometheus.scrape=true"
        - "prometheus.path=/actuator/prometheus"
        - "prometheus.port=8080"
    # NOTE: bff base image (eclipse-temurin:21-jre-alpine)는 bash 없음 → busybox wget 사용
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - internal-network
    environment:
      - EUREKA_URI=http://eureka:8761/eureka
      - AUTH_HOST=auth-server
      - AUTH_GRPC_PORT=9090
      - PYROSCOPE_SERVER_ADDRESS=http://pyroscope:4040
      - PYROSCOPE_APPLICATION_NAME=dev-backoffice-bff
      - COOKIE_DOMAIN=.platformholder.site

networks:
  barbellrobot-backend:
    driver: overlay
    name: barbellrobot-backend
    attachable: true
  find-my-pet-backend:
    driver: overlay
    name: find-my-pet-backend
    attachable: true
  internal-network:
    driver: overlay
    name: internal-network
    attachable: true
  auth-server:
